<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gjsBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gjsTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gjsCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background container for crisp rendering -->
  <rect width="128" height="128" rx="28" fill="#ffffff" />

  <!-- Medical Cross Outline Structure -->
  <g filter="url(#subtleGlow)" fill="none" stroke="url(#gjsBlueGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top arm -->
    <path d="M 46 44 L 46 20 C 46 14 50 10 56 10 L 72 10 C 78 10 82 14 82 20 L 82 44" />
    <!-- Bottom arm -->
    <path d="M 82 84 L 82 108 C 82 114 78 118 72 118 L 56 118 C 50 118 46 114 46 108 L 46 84" />
    <!-- Left arm -->
    <path d="M 44 82 L 20 82 C 14 82 10 78 10 72 L 10 56 C 10 50 14 46 20 46 L 44 46" />
    <!-- Right arm -->
    <path d="M 84 46 L 108 46 C 114 46 118 50 118 56 L 118 72 C 118 78 114 82 108 82 L 84 82" />
  </g>

  <!-- Central Interlocking Wellness Leaves -->
  <!-- Upper Leaf (Teal / Green) -->
  <path d="M 48 64 C 48 48 62 38 78 40 C 88 41 94 48 94 48 C 94 48 88 64 74 68 C 64 71 52 69 48 64 Z" 
        fill="url(#gjsTealGrad)" />

  <!-- Lower Leaf / Swoosh (Cyan / Sky Blue) -->
  <path d="M 80 64 C 80 80 66 90 50 88 C 40 87 34 80 34 80 C 34 80 40 64 54 60 C 64 57 76 59 80 64 Z" 
        fill="url(#gjsCyanGrad)" />

  <!-- Center accent vein line for depth -->
  <path d="M 48 64 Q 64 64 80 64" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
</svg>